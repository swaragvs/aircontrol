name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python make_icon.py
      - name: Build Windows application
        run: >
          python -m PyInstaller --noconfirm --clean --noconsole --onedir
          --name AirControl --icon icon.ico
          --distpath build/windows-dist
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32 tray.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc AirControl.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/AirControl-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Build web and sync Android project
        run: npm ci && npm run build && npx cap sync android
      - name: Audit production npm dependencies
        run: npm audit --omit=dev
      - name: Verify signing secrets are configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the $name repository secret before running the Android release build."
              exit 1
            fi
          done
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK is not signed with the Android debug certificate
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          verification="$("$build_tools/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$verification"
          if grep -qi "Android Debug" <<< "$verification"; then
            echo "::error::Release APK uses the Android debug signing certificate."
            exit 1
          fi
      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "AirControl-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: AirControl-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Generate checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          name: AirControl ${{ github.ref_name }}
          files: out/*
          prerelease: true
          body_path: RELEASE_NOTES.md
